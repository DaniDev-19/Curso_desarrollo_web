<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Pixel Art || Dibuja tu arte</h1>

    <div class="controls">
        <div class="palette">
            <button title="Negro" class="color selected" data-color="#000000" style="background:#000;"></button>
            <button title="Rojo" class="color" data-color="#ff0000" style="background:#ff0000;" style="background:#f00;"></button>
            <button title="Verde" class="color" data-color="#00ff00" style="background:#00ff00;" style="background:#0f0;"></button>
            <button title="Azul" class="color" data-color="#0000ff" style="background:#0000ff;" style="background:#00f;"></button>
            <button title="Amarillo" class="color" data-color="#ffff00" style="background:#ffff00;" style="background:#ff0;"></button>
            <button title="Magenta" class="color" data-color="#ff00ff" style="background:#ff00ff;" style="background:#f0f;"></button>
        </div>

        <button id="clear" title="Borrar">Borrar</button> 
        <button id="download" title="Descargar">Descargar</button> 
    </div>

    <div class="canvas-wrapper">
        <canvas id="canvas" width="320" height="320"></canvas>
    </div>

    <script src="pixel.js"></script>
</body>
</html>

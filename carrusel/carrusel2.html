<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrusel + js</title>
    <link rel="stylesheet" href="./styles2.css">
</head>

<body>
    <div class="carousel-js" id="modernCarousel">
        <div class="carousel-slides">
            <div class="slide-item active"><img src="https://picsum.photos/800/400?random=1" alt="Slide 1"></div>
            <div class="slide-item"><img src="https://picsum.photos/800/400?random=2" alt="Slide 2"></div>
            <div class="slide-item"><img src="https://picsum.photos/800/400?random=3" alt="Slide 3"></div>
        </div>

        <!-- Controles -->
        <button class="nav-btn prev" id="prevBtn" aria-label="Anterior">&#10094;</button>
        <button class="nav-btn next" id="nextBtn" aria-label="Siguiente">&#10095;</button>

        <!-- Puntos de navegación -->
        <div class="carousel-dots" id="dotsContainer"></div>
    </div>
    </div>
</body>
<script src="./carrusel.js"></script>

</html>

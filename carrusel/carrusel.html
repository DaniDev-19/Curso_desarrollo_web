<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel de Imagenes</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <!-- Carrusel 1 -->
    <div class="carrusel-container">
        <div class="carousel-slide">
            <img src="../public/jesus daniel.png" alt="Descripción 1">
        </div>
        <div class="carousel-slide">
            <img src="../public/jesus daniel.png" alt="Descripción 2">
        </div>
        <div  class="carousel-slide">
            <img src="../public/jesus daniel.png" alt="Descripción 3">
        </div>
    </div>

    <!-- Carusel 2 -->
    <div class="carousel-css">
        <div class="carousel-track">
            <div class="slide"><img src="https://picsum.photos/800/400?random=4" alt="Proyecto 1"></div>
            <div class="slide"><img src="https://picsum.photos/800/400?random=4" alt="Proyecto 2"></div>
            <div class="slide"><img src="https://picsum.photos/800/400?random=4" alt="Proyecto 3"></div>
            <div class="slide"><img src="https://picsum.photos/800/400?random=4" alt="Proyecto 4"></div>
        </div>
    </div>

</body>
</html>

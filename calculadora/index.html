<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calc-container">
    <header class="calc-header">
      <h1>Calculadora</h1>
      <p>Operaciones básicas: suma, resta, multiplicación y división.</p>
    </header>

    <section class="calculator">
      <div class="screen" id="screen">0</div>
      <div class="buttons">
        <button class="button secondary" data-action="clear">C</button>
        <button class="button secondary" data-action="delete">DEL</button>
        <button class="button secondary" data-action="percent">%</button>
        <button class="button operator" data-value="/">÷</button>

        <button class="button" data-value="7">7</button>
        <button class="button" data-value="8">8</button>
        <button class="button" data-value="9">9</button>
        <button class="button operator" data-value="*">×</button>

        <button class="button" data-value="4">4</button>
        <button class="button" data-value="5">5</button>
        <button class="button" data-value="6">6</button>
        <button class="button operator" data-value="-">−</button>

        <button class="button" data-value="1">1</button>
        <button class="button" data-value="2">2</button>
        <button class="button" data-value="3">3</button>
        <button class="button operator" data-value="+">+</button>

        <button class="button" data-value="0">0</button>
        <button class="button" data-value=".">.</button>
        <button class="button equals" data-action="calculate">=</button>
      </div>
    </section>
  </main>

  <script src="actions.js"></script>
</body>
</html>

<form action="/procesar" method="POST">
  <fieldset>
    <legend>Datos de Usuario</legend>
    
    <label for="nombre">Nombre completo:</label>
    <input type="text" id="nombre" name="nombre" required placeholder="Ej. Ana Pérez">

    <label for="email">Correo electrónico:</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Contraseña:</label>
    <input type="password" id="password" name="password" minlength="8" required>

    <button type="submit">Enviar Registro</button>
  </fieldset>
</form>

<!-- Botón para abrir el diálogo -->
<button onclick="document.getElementById('miModal').showModal()">Abrir Modal</button>

<!-- Ventana de Diálogo Nativa -->
<dialog id="miModal">
  <form method="dialog">
    <h3>Ventana Emergente Moderna</h3>
    <p>Esta ventana utiliza HTML nativo puro sin librerías externas.</p>
    <button>Cerrar</button>
  </form>
</dialog>
